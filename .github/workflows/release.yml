name: Release Build & Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install psutil pyinstaller

      - name: Build Windows Standalone Executable
        run: |
          pyinstaller --onefile --console --name syspulse-windows-x64 main.py

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: dist/syspulse-windows-x64.exe

  build-linux-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil pyinstaller

      - name: Build Debian (.deb) Package
        run: |
          python build_deb.py

      - name: Build Linux Standalone Binary
        run: |
          pyinstaller --onefile --name syspulse-linux-x86_64 main.py

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/*.deb
            dist/syspulse-linux-x86_64

  publish-release:
    needs: [build-windows, build-linux-deb]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            windows-binary/syspulse-windows-x64.exe
            linux-artifacts/*.deb
            linux-artifacts/syspulse-linux-x86_64
          draft: false
          prerelease: false
          generate_release_notes: true
